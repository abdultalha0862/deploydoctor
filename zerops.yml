zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npx prisma generate
        - npm run build
      deployFiles:
        - ./dist
        - ./node_modules
        - ./package.json
        - ./prisma
        - ./prisma.config.ts
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm start